<mat-card appearance="outlined">
  <mat-card-header>
    <button mat-flat-button (click)="openCustomerAddDialog()">Add Customer</button>
  </mat-card-header>

  <mat-card-header>
    <form [formGroup]="searchForm" class="search-form">

      <mat-form-field appearance="outline">
        <mat-label>Customer ID</mat-label>
        <input matInput formControlName="id">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Customer Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mobile Number</mat-label>
        <input matInput formControlName="mobileNo">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>NID Number</mat-label>
        <input matInput formControlName="nid">
      </mat-form-field>

      <button mat-button class="transfer-button-color" style="margin-top: -1%; "
        (click)="loadCustomers()">Search</button>
      <button mat-button (click)="clearSearchForm()" class="widthraw-button-color"
        style="margin-top: -1%;">Clear</button>

    </form>
  </mat-card-header>
  <mat-card-content style="margin-top: 2%;">
    <mat-card class="table-card">
      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">

          <!-- ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Customer ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>


          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>

          <ng-container matColumnDef="mobileNo">
            <th mat-header-cell *matHeaderCellDef>Mobile Number</th>
            <td mat-cell *matCellDef="let row">{{ row.mobileNo }}</td>
          </ng-container>

          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef>Address</th>
            <td mat-cell *matCellDef="let row">{{ row.address }}</td>
          </ng-container>

          <ng-container matColumnDef="nid">
            <th mat-header-cell *matHeaderCellDef>NID</th>
            <td mat-cell *matCellDef="let row">{{ row.nid }}</td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef style="text-align: center !important;">Actions</th>
            <td mat-cell *matCellDef="let row" style="text-align: center !important;">
              <button mat-flat-button color="primary" (click)="onRowClick(row)">View</button>
              <button mat-flat-button color="primary" (click)="openCustomerUpdateDialog(row)">Edit</button>

            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;" [class.odd-row]="i % 2 !== 0"
            [class.even-row]="i % 2 === 0">
          </tr>
        </table>
      </div>

      <mat-paginator [length]="totalElements" [pageSize]="size" [pageSizeOptions]="[ 5, 10, 20]"
        (page)="onPageChange($event)">
      </mat-paginator>

    </mat-card>
  </mat-card-content>
</mat-card>
