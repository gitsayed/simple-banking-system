<mat-card appearance="outlined">
  <mat-card-header>
    <button mat-flat-button (click)="openUserAddDialog()">Add User</button>
  </mat-card-header>

  <mat-card-header>
    <form [formGroup]="searchForm" class="search-form">

      <mat-form-field appearance="outline">
        <mat-label>User ID</mat-label>
        <input matInput formControlName="id">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mobile Number</mat-label>
        <input matInput formControlName="mobileNo">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="ACTIVE">Active</mat-option>
          <mat-option value="INACTIVE">In Active</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Dept</mat-label>
        <input matInput formControlName="dept">
      </mat-form-field>

      <button mat-button class="transfer-button-color" style="margin-top: -1%; " (click)="loadUsers()">Search</button>
      <button mat-button (click)="clearSearchForm()" class="widthraw-button-color"
        style="margin-top: -1%;">Clear</button>

    </form>
  </mat-card-header>

  <mat-card-content style="margin-top: 2%;">
    <mat-card class="table-card">
      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">

          <!-- ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>User ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>

          <!-- Username -->
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef>Username</th>
            <td mat-cell *matCellDef="let row">{{ row.username }}</td>
          </ng-container>

          <!-- Full Name -->
          <ng-container matColumnDef="mobileNo">
            <th mat-header-cell *matHeaderCellDef>Mobile Number</th>
            <td mat-cell *matCellDef="let row">{{ row.mobileNo }}</td>
          </ng-container>

          <!-- Email -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let row">{{ row.email }}</td>
          </ng-container>

          <!-- Status -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let row">{{ row.status }}</td>
          </ng-container>

          <!-- Dept -->
          <ng-container matColumnDef="dept">
            <th mat-header-cell *matHeaderCellDef>dept</th>
            <td mat-cell *matCellDef="let row">{{ row.dept }}</td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row">
              <button mat-flat-button color="primary" (click)="onRowClick(row)">View</button>
              <button mat-flat-button color="primary" (click)="openUserUpdateDialog(row)">Edit</button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;" [class.odd-row]="i % 2 !== 0"
            [class.even-row]="i % 2 === 0">
          </tr>
        </table>
      </div>

      <mat-paginator [length]="totalElements" [pageSize]="size" [pageSizeOptions]="[ 5, 10, 20]"
        (page)="onPageChange($event)">
      </mat-paginator>

    </mat-card>
  </mat-card-content>
</mat-card>
