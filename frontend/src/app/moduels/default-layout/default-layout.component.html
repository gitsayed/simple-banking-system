<mat-toolbar style="background-color:#DEC19B; display: flex;">
  <span class="bank-title">CBS Bank</span>
  <span style="margin-left: auto; display: flex; gap: 15px;">
    <span class="profile" (click)="goToProfile()">Profile</span>
    <span class="logout" (click)="logout()">Logout</span>
  </span>
</mat-toolbar>

<div class="dashboard-container">
  <mat-sidenav-container class="sidenav-container">

    <mat-sidenav mode="side" opened class="sidenav">
      <mat-nav-list>
          <a mat-list-item routerLink="/profile" routerLinkActive="active-link">
          Profile
        </a>
          <a mat-list-item routerLink="/user-management" routerLinkActive="active-link">
          User-Management
        </a>
         <a mat-list-item routerLink="/customers" routerLinkActive="active-link">
          Customer
        </a>
        <a mat-list-item routerLink="/accounts" routerLinkActive="active-link">
          Accounts
        </a>
        <a mat-list-item routerLink="/transactions" routerLinkActive="active-link">
          Transactions
        </a>
       
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="sidenav-content">
      <div class="content">
            <app-loader></app-loader>
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>

  </mat-sidenav-container>
</div>
