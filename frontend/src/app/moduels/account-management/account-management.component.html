<mat-card appearance="outlined">
    <mat-card-header>
        <button mat-flat-button (click)="openCustomerAddDialog()">Create Account</button>
    </mat-card-header>
    <mat-card-content style="margin-top: 2%;">
        <mat-card class="table-card">
            <div class="table-container">
                <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">

                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>ID</th>
                        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
                    </ng-container>


                    <ng-container matColumnDef="accountNumber">
                        <th mat-header-cell *matHeaderCellDef>Account Number</th>
                        <td mat-cell *matCellDef="let row">{{ row.accountNumber }}</td>
                    </ng-container>

                    <ng-container matColumnDef="accountType">
                        <th mat-header-cell *matHeaderCellDef>Account Type</th>
                        <td mat-cell *matCellDef="let row">{{ row.accountType }}</td>
                    </ng-container>
                    . <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef>Status</th>
                        <td mat-cell *matCellDef="let row">{{ row.status }}</td>
                    </ng-container>
                    <ng-container matColumnDef="balance" >
                        <th mat-header-cell *matHeaderCellDef style="text-align: right;">Current Balance</th>
                        <td mat-cell *matCellDef="let row" style="text-align: right;">{{ row.balance | number:'2.2'}}</td>
                    </ng-container>

                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef style="text-align: center !important;">Actions</th>
                        <td mat-cell *matCellDef="let row" style="text-align: center !important;">
                            <button mat-flat-button color="primary" (click)="onRowClick(row)">View</button>
                            <button mat-flat-button color="primary" (click)="openCustomerUpdateDialog(row)">Edit</button>

                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;"
                        [class.odd-row]="i % 2 !== 0" [class.even-row]="i % 2 === 0">
                    </tr>
                </table>
            </div>

            <mat-paginator [length]="totalElements" [pageSize]="size" [pageSizeOptions]="[ 5, 10, 20]"
                (page)="onPageChange($event)">
            </mat-paginator>

        </mat-card>
    </mat-card-content>
</mat-card>
