<!-- Header -->
<h2 mat-dialog-title>
    {{action=='add'?'Create': 'Update'}} Customer
    <button mat-icon-button class="close-btn" (click)="close()">
        <mat-icon>close</mat-icon>
    </button>
</h2>

<!-- Content -->
<mat-dialog-content class="form-container">

    <form [formGroup]="customerForm">

        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name">
            <mat-error *ngIf="customerForm.get('name')?.hasError('required')">
                Name is required
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Gender</mat-label>
            <mat-select formControlName="gender">
                <mat-option value="MALE">Male</mat-option>
                <mat-option value="FEMALE">Female</mat-option>
            </mat-select>
             <mat-error *ngIf="customerForm.get('gender')?.hasError('required')">
                Gender is required
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Address</mat-label>
            <input matInput formControlName="address">
            <mat-error *ngIf="customerForm.get('address')?.hasError('required')">
                Address is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Mobile Number</mat-label>
            <input matInput formControlName="mobileNo">
            <mat-error *ngIf="customerForm.get('mobileNo')?.hasError('required')">
                Mobile Number is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>NID</mat-label>
            <input matInput formControlName="nid">
            <mat-error *ngIf="customerForm.get('nid')?.hasError('required')">
                NID is required
            </mat-error>
        </mat-form-field>

    </form>

</mat-dialog-content>

<!-- Footer -->
<mat-dialog-actions align="end">
    <button mat-button (click)="close()">Cancel</button>
    <button mat-raised-button color="primary" (click)="submit()" [disabled]="customerForm.invalid">
        Save
    </button>
</mat-dialog-actions>
